<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Lista da Isabelly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --vinho: #8C1F2C; --vinho-esc: #5E1018; --creme: #FBF6EA; --creme2: #F4EBD9; --papel: #FFFBF1;
    --tinta: #2B1A18; --corpo: #4A322E; --suave: #6B534E; --dourado: #C19A4B; --borda: #D8BC85; --rot: #7B5A2E;
    --ok: #2F6B3A; --ok-bg: #E4F0E1; --aviso: #8A5A12; --aviso-bg: #F7EBCF; --azul: #2D4F7C; --azul-bg: #E1E9F4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(120% 80% at 50% 0%, #8A1C26 0%, #6B131C 45%, #4A0C13 100%) fixed; color: var(--tinta); font: 17px/1.45 'Cormorant Garamond', Georgia, serif; padding: 0 16px 60px; }
  h1, h2, .cinzel, button, .tab, th, label { font-family: 'Cinzel', serif; }
  a { color: var(--vinho); }
  .topo { max-width: 1080px; margin: 0 auto; padding: 28px 0 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: #F6E7C6; }
  .topo h1 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: .2em; }
  .topo .quem { font-size: 15px; color: #E4BFBF; display: flex; gap: 12px; align-items: center; }
  .caixa { max-width: 1080px; margin: 0 auto; background: linear-gradient(176deg, var(--creme), var(--creme2)); border-radius: 4px; box-shadow: 0 30px 70px rgba(20,2,6,.5); padding: 24px; }
  .login { max-width: 380px; margin: 12vh auto 0; text-align: center; border-radius: 50% 50% 4px 4px / 12% 12% 0 0; padding: 48px 30px 32px; }
  .login h2 { font-size: 13px; letter-spacing: .24em; color: var(--rot); font-weight: 500; margin: 0 0 6px; }
  .login .nome { font-family: 'Pinyon Script', 'Cormorant Garamond', cursive; font-size: 30px; color: var(--vinho); font-style: italic; margin-bottom: 20px; }
  input, select, textarea { width: 100%; font: 17px 'Cormorant Garamond', serif; padding: 10px 12px; border: 1px solid #C9A863; background: var(--papel); color: var(--tinta); border-radius: 0; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--vinho); }
  textarea { resize: vertical; min-height: 64px; }
  label { display: block; font-size: 10.5px; letter-spacing: .18em; color: var(--rot); margin: 0 0 5px; }
  .campo { margin-bottom: 14px; }
  button { font-size: 11px; letter-spacing: .16em; padding: 11px 16px; cursor: pointer; border: 1px solid #C9A863; background: transparent; color: var(--suave); transition: all .18s; }
  button:hover { border-color: var(--vinho); color: var(--vinho); }
  button.pri { background: var(--vinho); border-color: var(--vinho); color: var(--creme); }
  button.pri:hover { background: var(--vinho-esc); border-color: var(--vinho-esc); color: var(--creme); }
  button.mini { padding: 6px 10px; font-size: 10px; }
  button.perigo:hover { background: var(--vinho); color: var(--creme); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { font-style: italic; color: var(--vinho); min-height: 22px; margin: 10px 0 0; }
  .abas { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid #E0CDA4; padding-bottom: 14px; }
  .tab { border: 1px solid #C9A863; background: transparent; color: var(--suave); }
  .tab[aria-selected="true"] { background: var(--vinho); border-color: var(--vinho); color: var(--creme); }
  .resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .kpi { background: var(--papel); border: 1px solid #E0CDA4; padding: 12px 14px; }
  .kpi .v { font-size: 30px; line-height: 1; color: var(--vinho); }
  .kpi .r { font-family: 'Cinzel', serif; font-size: 9.5px; letter-spacing: .18em; color: var(--rot); margin-top: 6px; }
  .grid2 { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .form { background: var(--papel); border: 1px solid #E0CDA4; padding: 18px; position: sticky; top: 16px; }
  @media (max-width: 860px) { .form { position: static; } }
  .form h2 { font-size: 12px; letter-spacing: .2em; font-weight: 500; color: var(--rot); margin: 0 0 14px; }
  .linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .foto-prev { width: 100%; aspect-ratio: 4/3; object-fit: cover; border: 1px solid var(--borda); margin-top: 8px; display: block; background: repeating-linear-gradient(135deg,#F0E4CB 0 8px,#F8F0DF 8px 16px); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .check input { width: auto; }
  .master-box { align-items: flex-start; background: #F7EBCF; border: 1px solid #E0C484; padding: 10px 12px; margin-bottom: 14px; font-family: 'Cormorant Garamond', serif; letter-spacing: 0; color: var(--tinta); font-size: 16px; cursor: pointer; }
  .master-box b { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .16em; color: var(--vinho); font-weight: 600; }
  .master-box small { font-size: 14px; color: var(--suave); }
  .master-box input { margin-top: 3px; }
  .item.master { border-color: #C9A863; background: #FBF1DA; }
  .selo.master { background: var(--vinho); color: var(--creme); }
  .lista-p { display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center; background: var(--papel); border: 1px solid #E0CDA4; padding: 10px; }
  .item.inativo { opacity: .55; }
  .item img, .item .sem { width: 76px; height: 57px; object-fit: cover; border: 1px solid var(--borda); background: repeating-linear-gradient(135deg,#F0E4CB 0 6px,#F8F0DF 6px 12px); display: block; }
  .item .n { font-weight: 600; font-size: 19px; line-height: 1.2; }
  .item .s { font-size: 15px; color: var(--suave); }
  .item .acoes { justify-content: flex-end; }
  .selo { display: inline-block; font-family: 'Cinzel', serif; font-size: 9.5px; letter-spacing: .14em; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
  .selo.reservado { background: var(--aviso-bg); color: var(--aviso); }
  .selo.comprado { background: var(--azul-bg); color: var(--azul); }
  .comp { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .comp .tem { font-size: 14px; color: var(--ok); }
  .comp .nao { font-size: 14px; color: var(--suave); font-style: italic; }
  button.aprovar { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.aprovar:hover { background: #22502b; border-color: #22502b; color: #fff; }
  .selo.agradecido { background: var(--ok-bg); color: var(--ok); }
  .selo.livre { background: #EFE7D6; color: var(--suave); }
  .barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .barra input[type=search] { flex: 1; min-width: 180px; }
  .barra select { width: auto; }
  .tabela-wrap { overflow-x: auto; border: 1px solid #E0CDA4; background: var(--papel); }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  th { font-size: 9.5px; letter-spacing: .16em; color: var(--rot); font-weight: 500; text-align: left; padding: 10px; border-bottom: 1px solid #E0CDA4; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #EFE4CC; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td select { padding: 5px 8px; font-size: 15px; width: auto; }
  td .obs { font-size: 14px; color: var(--suave); font-style: italic; }
  .vazio { text-align: center; font-style: italic; color: var(--suave); padding: 24px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="topo" id="topo" hidden>
  <h1>PAINEL · ISABELLY 15</h1>
  <div class="quem"><span id="emailUser"></span><a href="../" target="_blank" style="color:#F6E7C6">ver site ↗</a><button class="mini" id="sair" style="color:#F6E7C6;border-color:rgba(224,196,132,.55)">SAIR</button></div>
</header>

<!-- Login -->
<section class="caixa login" id="telaLogin" hidden>
  <h2>PAINEL DA LISTA</h2>
  <div class="nome">Isabelly · 15 anos</div>
  <form id="formLogin">
    <div class="campo"><input id="loginEmail" type="email" placeholder="E-mail" autocomplete="username" required></div>
    <div class="campo"><input id="loginSenha" type="password" placeholder="Senha" autocomplete="current-password" required></div>
    <button class="pri" style="width:100%" type="submit">ENTRAR</button>
  </form>
  <p class="msg" id="msgLogin"></p>
</section>

<section class="caixa login" id="telaConfig" hidden>
  <h2>FALTA CONFIGURAR</h2>
  <p>Preencha <b>url</b> e <b>anonKey</b> do Supabase no arquivo <code>site/config.js</code> e publique de novo.</p>
</section>

<!-- App -->
<main class="caixa" id="telaApp" hidden>
  <div id="avisoAdmin" hidden style="background:#F7E1E1;border:1px solid #D9A3A3;color:#6E1620;padding:12px 14px;margin-bottom:16px;font-size:16px"></div>
  <div class="abas" role="tablist">
    <button class="tab" role="tab" data-aba="presenteadores" aria-selected="true">QUEM PRESENTEOU</button>
    <button class="tab" role="tab" data-aba="presentes" aria-selected="false">PRESENTES DA LISTA</button>
  </div>

  <!-- Aba: Quem presenteou -->
  <section id="abaPresenteadores">
    <div class="resumo" id="resumo"></div>
    <div class="grid2">
      <form class="form" id="formPessoa">
        <h2 id="tituloPessoa">LANÇAR PRESENTE</h2>
        <input type="hidden" id="pId">
        <div class="campo"><label for="pNome">NOME *</label><input id="pNome" maxlength="80" required></div>
        <div class="campo"><label for="pTel">WHATSAPP</label><input id="pTel" type="tel" maxlength="30"></div>
        <div class="campo"><label for="pPresente">ITEM DA LISTA</label><select id="pPresente"></select></div>
        <div class="campo"><label for="pDesc">OU DESCREVA O PRESENTE</label><input id="pDesc" placeholder="Ex.: Vale R$ 1.000, Pix, perfume…" maxlength="120"></div>
        <div class="linha2">
          <div class="campo"><label for="pValor">VALOR (R$)</label><input id="pValor" type="number" step="0.01" min="0" inputmode="decimal"></div>
          <div class="campo"><label for="pStatus">STATUS</label>
            <select id="pStatus"><option value="reservado">Reservado (aguardando)</option><option value="comprado">Comprado ✓ (aprovado)</option><option value="agradecido">Agradecido</option></select>
          </div>
        </div>
        <div class="campo"><label for="pComp">COMPROVANTE DO PIX (imagem ou PDF)</label><input id="pComp" type="file" accept="image/*,application/pdf"><div class="obs" id="pCompAtual" style="font-size:14px;margin-top:4px"></div></div>
        <div class="campo"><label for="pObs">OBSERVAÇÃO</label><textarea id="pObs" maxlength="500"></textarea></div>
        <div class="acoes">
          <button class="pri" type="submit" id="btnSalvarPessoa">SALVAR</button>
          <button type="button" id="btnLimparPessoa">LIMPAR</button>
        </div>
        <p class="msg" id="msgPessoa"></p>
      </form>

      <div>
        <div class="barra">
          <input type="search" id="busca" placeholder="Buscar por nome, presente, telefone…">
          <select id="filtroStatus">
            <option value="">Todos os status</option>
            <option value="reservado">Reservado</option>
            <option value="comprado">Comprado ✓</option>
            <option value="agradecido">Agradecido</option>
          </select>
          <button type="button" id="btnCsv">EXPORTAR CSV</button>
        </div>
        <div class="tabela-wrap">
          <table>
            <thead><tr><th>NOME</th><th>PRESENTE</th><th>VALOR</th><th>STATUS</th><th>COMPROVANTE</th><th>DATA</th><th></th></tr></thead>
            <tbody id="tbPessoas"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- Aba: Presentes -->
  <section id="abaPresentes" hidden>
    <div class="grid2">
      <form class="form" id="formPresente">
        <h2 id="tituloPresente">NOVO PRESENTE</h2>
        <input type="hidden" id="gId">
        <label class="check master-box"><input type="checkbox" id="gMaster"> <span><b>PRESENTE MASTER</b><br><small>O vale em destaque no bilhete do topo da página (só um).</small></span></label>
        <div class="campo"><label for="gNome">NOME *</label><input id="gNome" maxlength="120" required></div>
        <div class="linha2">
          <div class="campo"><label for="gCat">CATEGORIA</label><input id="gCat" maxlength="30" placeholder="BELEZA" list="categorias"></div>
          <div class="campo"><label for="gPreco">PREÇO (R$)</label><input id="gPreco" type="number" step="0.01" min="0" inputmode="decimal"></div>
        </div>
        <datalist id="categorias"></datalist>
        <div class="campo"><label for="gLink">LINK DA LOJA (opcional)</label><input id="gLink" type="url" placeholder="https://"></div>
        <div class="campo">
          <label for="gFoto">FOTO</label>
          <input id="gFoto" type="file" accept="image/*">
          <img id="gFotoPrev" class="foto-prev" alt="" hidden>
          <input type="hidden" id="gFotoUrl">
        </div>
        <div class="linha2">
          <div class="campo"><label for="gOrdem">ORDEM</label><input id="gOrdem" type="number" step="1" value="0"></div>
          <div class="campo"><label>&nbsp;</label><label class="check" style="font-family:inherit;letter-spacing:0;color:inherit;font-size:16px"><input type="checkbox" id="gAtivo" checked> Aparece no site</label></div>
        </div>
        <div class="acoes">
          <button class="pri" type="submit" id="btnSalvarPresente">SALVAR</button>
          <button type="button" id="btnLimparPresente">LIMPAR</button>
        </div>
        <p class="msg" id="msgPresente"></p>
      </form>
      <div class="lista-p" id="listaPresentes"></div>
    </div>
  </section>
</main>

<input type="file" id="anexoLinha" accept="image/*,application/pdf" hidden>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';
  var CFG = window.SUPABASE_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var mostrar = function (id, sim) { $(id).hidden = !sim; };

  if (!CFG.url || !CFG.anonKey) { mostrar('telaConfig', true); return; }

  var sb = window.supabase.createClient(CFG.url, CFG.anonKey);
  var presentes = [], pessoas = [];
  var STATUS = { reservado: 'Reservado', comprado: 'Comprado ✓', agradecido: 'Agradecido' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function brl(v) { return v == null || v === '' ? '' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  function data(d) { return d ? new Date(d).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : ''; }
  function num(v) { return v === '' || v == null ? null : Number(v); }
  function whats(t) { var d = String(t || '').replace(/\D/g, ''); if (!d) return ''; if (d.length <= 11) d = '55' + d; return 'https://wa.me/' + d; }

  // ---------- Sessão
  function entrar(session) {
    mostrar('telaLogin', !session);
    mostrar('telaApp', !!session);
    mostrar('topo', !!session);
    if (session) {
      $('emailUser').textContent = session.user.email;
      sb.rpc('is_admin').then(function (r) {
        var ok = r.data === true;
        $('avisoAdmin').hidden = ok;
        if (!ok) $('avisoAdmin').innerHTML = '<b>Sem permissão de administrador.</b> O e-mail <b>' + esc(session.user.email) +
          '</b> não está na tabela <code>admins</code> do Supabase — por isso aparece "row-level security". No SQL Editor rode:<br><code>insert into public.admins (email) values (\'' + esc(session.user.email) + '\');</code><br>e depois recarregue esta página.' +
          (r.error ? '<br><small>(' + esc(r.error.message) + ')</small>' : '');
      });
      carregarTudo();
    }
  }
  sb.auth.getSession().then(function (r) { entrar(r.data.session); });
  sb.auth.onAuthStateChange(function (_e, session) { entrar(session); });

  $('formLogin').addEventListener('submit', function (e) {
    e.preventDefault();
    $('msgLogin').textContent = 'Entrando…';
    sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginSenha').value })
      .then(function (r) { $('msgLogin').textContent = r.error ? 'E-mail ou senha incorretos.' : ''; });
  });
  $('sair').addEventListener('click', function () { sb.auth.signOut(); });

  // ---------- Abas
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-selected', String(x === t)); });
      mostrar('abaPresenteadores', t.dataset.aba === 'presenteadores');
      mostrar('abaPresentes', t.dataset.aba === 'presentes');
    });
  });

  // ---------- Dados
  function carregarTudo() {
    return Promise.all([
      sb.from('presentes').select('*').order('ordem').order('criado_em'),
      sb.from('presenteadores').select('*').order('criado_em', { ascending: false })
    ]).then(function (res) {
      if (res[0].error || res[1].error) {
        var m = (res[0].error || res[1].error).message;
        $('tbPessoas').innerHTML = '<tr><td colspan="7" class="vazio">Erro ao carregar: ' + esc(m) + '</td></tr>';
        return;
      }
      presentes = res[0].data; pessoas = res[1].data;
      if (!presentes.length && !pessoas.length) verificarAdmin();
      renderPresentes(); renderPessoas(); renderSelectPresentes();
    });
  }
  function verificarAdmin() {
    sb.rpc('is_admin').then(function (r) {
      if (r.data === false) {
        $('tbPessoas').innerHTML = '<tr><td colspan="7" class="vazio">Este e-mail não está na tabela <b>admins</b> do Supabase. Adicione-o para ver e editar os dados.</td></tr>';
      }
    });
  }
  function nomePresente(id) { var p = presentes.find(function (x) { return x.id === id; }); return p ? p.nome : ''; }

  // ---------- Presentes
  var MASTER = 'VALE-PRESENTE';
  function ehMaster(p) { return String(p.categoria || '').trim().toUpperCase() === MASTER; }
  function atualizarMasterUI() {
    var m = $('gMaster').checked;
    $('gCat').disabled = m;
    if (m) $('gCat').value = MASTER; else if ($('gCat').value === MASTER) $('gCat').value = '';
  }
  $('gMaster').addEventListener('change', function () {
    if (this.checked && !$('gNome').value.trim()) $('gNome').value = 'Vale-presente';
    atualizarMasterUI();
  });
  function renderPresentes() {
    var cats = {};
    presentes.forEach(function (p) { if (p.categoria && !ehMaster(p)) cats[p.categoria] = 1; });
    $('categorias').innerHTML = Object.keys(cats).map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
    if (!presentes.length) { $('listaPresentes').innerHTML = '<p class="vazio">Nenhum presente cadastrado ainda.</p>'; return; }
    var ordenados = presentes.filter(ehMaster).concat(presentes.filter(function (p) { return !ehMaster(p); }));
    $('listaPresentes').innerHTML = ordenados.map(function (p) {
      var r = pessoas.find(function (x) { return x.presente_id === p.id; });
      var selo = r ? '<span class="selo ' + r.status + '">' + STATUS[r.status].toUpperCase() + ' · ' + esc(r.nome) + '</span>' : '<span class="selo livre">DISPONÍVEL</span>';
      var m = ehMaster(p);
      return '<div class="item' + (p.ativo ? '' : ' inativo') + (m ? ' master' : '') + '">' +
        (p.foto_url ? '<img src="' + esc(p.foto_url) + '" alt="">' : '<div class="sem"></div>') +
        '<div><div class="s">' + (m ? '<span class="selo master">★ PRESENTE MASTER</span>' : esc(p.categoria)) + (p.ativo ? '' : ' · oculto') + '</div><div class="n">' + esc(p.nome) + '</div>' +
          '<div class="s">' + brl(p.preco) + ' · ordem ' + p.ordem + '</div><div style="margin-top:4px">' + selo + '</div></div>' +
        '<div class="acoes"><button class="mini" data-editar-g="' + p.id + '">EDITAR</button>' +
          '<button class="mini perigo" data-apagar-g="' + p.id + '">EXCLUIR</button></div>' +
      '</div>';
    }).join('');
  }
  function renderSelectPresentes() {
    var atual = $('pPresente').value;
    $('pPresente').innerHTML = '<option value="">— nenhum (presente fora da lista) —</option>' +
      presentes.map(function (p) { return '<option value="' + p.id + '">' + esc(p.nome) + '</option>'; }).join('');
    $('pPresente').value = atual;
  }
  function limparPresente() {
    $('formPresente').reset(); $('gId').value = ''; $('gFotoUrl').value = ''; $('gAtivo').checked = true; $('gMaster').checked = false; atualizarMasterUI();
    $('gOrdem').value = presentes.length ? Math.max.apply(null, presentes.map(function (p) { return p.ordem; })) + 1 : 1;
    $('gFotoPrev').hidden = true; $('tituloPresente').textContent = 'NOVO PRESENTE'; $('msgPresente').textContent = '';
  }
  $('btnLimparPresente').addEventListener('click', limparPresente);
  $('gFoto').addEventListener('change', function () {
    var f = this.files[0];
    if (f) { $('gFotoPrev').src = URL.createObjectURL(f); $('gFotoPrev').hidden = false; }
  });
  $('listaPresentes').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.editarG) {
      var p = presentes.find(function (x) { return x.id === b.dataset.editarG; });
      $('gId').value = p.id; $('gNome').value = p.nome; $('gCat').value = p.categoria; $('gPreco').value = p.preco == null ? '' : p.preco;
      $('gLink').value = p.link || ''; $('gOrdem').value = p.ordem; $('gAtivo').checked = p.ativo; $('gMaster').checked = ehMaster(p); atualizarMasterUI(); $('gFotoUrl').value = p.foto_url || ''; $('gFoto').value = '';
      $('gFotoPrev').hidden = !p.foto_url; if (p.foto_url) $('gFotoPrev').src = p.foto_url;
      $('tituloPresente').textContent = 'EDITAR PRESENTE'; $('msgPresente').textContent = '';
      $('formPresente').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (b.dataset.apagarG) {
      var g = presentes.find(function (x) { return x.id === b.dataset.apagarG; });
      if (!confirm('Excluir "' + g.nome + '"? Quem já reservou continua no controle, sem o vínculo com o item.\n\nDica: para só esconder do site, edite e desmarque "Aparece no site".')) return;
      sb.from('presentes').delete().eq('id', g.id).then(function (r) { if (r.error) alert(r.error.message); carregarTudo(); });
    }
  });

  function reduzirImagem(file) {
    return new Promise(function (ok) {
      var img = new Image();
      img.onload = function () {
        var max = 900, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { ok(b || file); }, 'image/jpeg', 0.84);
      };
      img.onerror = function () { ok(file); };
      img.src = URL.createObjectURL(file);
    });
  }

  $('formPresente').addEventListener('submit', function (e) {
    e.preventDefault();
    if ($('gMaster').checked) {
      var outro = presentes.find(function (p) { return ehMaster(p) && p.id !== $('gId').value; });
      if (outro) { $('msgPresente').textContent = 'Já existe um presente master ("' + outro.nome + '"). Edite esse ou desmarque ele antes.'; return; }
      if (!num($('gPreco').value)) { $('msgPresente').textContent = 'Informe o valor do presente master (ex.: 1000).'; return; }
    }
    var btn = $('btnSalvarPresente'); btn.disabled = true; $('msgPresente').textContent = 'Salvando…';
    var arquivo = $('gFoto').files[0];
    var subir = arquivo
      ? reduzirImagem(arquivo).then(function (blob) {
          var caminho = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
          return sb.storage.from('presentes').upload(caminho, blob, { contentType: 'image/jpeg', upsert: false }).then(function (r) {
            if (r.error) throw new Error('ao enviar a foto — ' + r.error.message);
            return sb.storage.from('presentes').getPublicUrl(caminho).data.publicUrl;
          });
        })
      : Promise.resolve($('gFotoUrl').value || null);
    subir.then(function (fotoUrl) {
      var dados = {
        nome: $('gNome').value.trim(), categoria: $('gMaster').checked ? MASTER : $('gCat').value.trim().toUpperCase(), preco: num($('gPreco').value),
        link: $('gLink').value.trim() || null, ordem: parseInt($('gOrdem').value, 10) || 0, ativo: $('gAtivo').checked, foto_url: fotoUrl
      };
      var id = $('gId').value;
      return id ? sb.from('presentes').update(dados).eq('id', id) : sb.from('presentes').insert(dados);
    }).then(function (r) {
      if (r.error) throw new Error('ao salvar o presente — ' + r.error.message);
      limparPresente(); $('msgPresente').textContent = 'Salvo ✓';
      return carregarTudo();
    }).catch(function (err) {
      $('msgPresente').textContent = 'Erro: ' + (err.message || err);
    }).then(function () { btn.disabled = false; });
  });

  // ---------- Quem presenteou
  function renderResumo() {
    var c = { reservado: 0, comprado: 0, agradecido: 0 }, total = 0;
    pessoas.forEach(function (p) {
      c[p.status]++;
      var v = p.valor != null ? Number(p.valor) : (function () { var g = presentes.find(function (x) { return x.id === p.presente_id; }); return g && g.preco != null ? Number(g.preco) : 0; })();
      if (p.status !== 'reservado') total += v;
    });
    var livres = presentes.filter(function (g) { return g.ativo && !pessoas.some(function (p) { return p.presente_id === g.id; }); }).length;
    $('resumo').innerHTML = [
      [pessoas.length, 'PESSOAS'], [c.reservado, 'AGUARDANDO APROVAÇÃO'], [c.comprado + c.agradecido, 'COMPRADOS (APROVADOS)'],
      [c.agradecido, 'AGRADECIDOS'], [livres, 'ITENS DISPONÍVEIS'], [brl(total), 'VALOR APROVADO']
    ].map(function (k) { return '<div class="kpi"><div class="v">' + k[0] + '</div><div class="r">' + k[1] + '</div></div>'; }).join('');
  }
  function filtradas() {
    var q = $('busca').value.trim().toLowerCase(), st = $('filtroStatus').value;
    return pessoas.filter(function (p) {
      if (st && p.status !== st) return false;
      if (!q) return true;
      return [p.nome, p.telefone, p.descricao, p.observacao, nomePresente(p.presente_id)].join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }
  function renderPessoas() {
    renderResumo();
    var lista = filtradas();
    if (!lista.length) { $('tbPessoas').innerHTML = '<tr><td colspan="7" class="vazio">' + (pessoas.length ? 'Nada encontrado.' : 'Ninguém reservou ainda.') + '</td></tr>'; return; }
    $('tbPessoas').innerHTML = lista.map(function (p) {
      var item = nomePresente(p.presente_id);
      var desc = [item, p.descricao].filter(Boolean).join(' — ') || '—';
      var valor = p.valor != null ? brl(p.valor) : (function () { var g = presentes.find(function (x) { return x.id === p.presente_id; }); return g ? brl(g.preco) : ''; })();
      var w = whats(p.telefone);
      return '<tr>' +
        '<td><b>' + esc(p.nome) + '</b>' + (p.telefone ? '<br><a href="' + w + '" target="_blank" rel="noopener">' + esc(p.telefone) + '</a>' : '') +
          (p.origem === 'manual' ? '<br><span class="obs">lançado no painel</span>' : '') + '</td>' +
        '<td>' + esc(desc) + (p.observacao ? '<div class="obs">' + esc(p.observacao) + '</div>' : '') + '</td>' +
        '<td style="white-space:nowrap">' + valor + '</td>' +
        '<td><select data-status="' + p.id + '">' + Object.keys(STATUS).map(function (s) { return '<option value="' + s + '"' + (s === p.status ? ' selected' : '') + '>' + STATUS[s] + '</option>'; }).join('') + '</select></td>' +
        '<td><div class="comp">' +
          (p.comprovante_path ? '<span class="tem">✓ anexado</span><button class="mini" data-ver="' + p.id + '">VER</button>' : '<span class="nao">sem comprovante</span>') +
          '<button class="mini" data-anexar="' + p.id + '">' + (p.comprovante_path ? 'TROCAR' : 'ANEXAR') + '</button>' +
          (p.status === 'reservado' ? '<button class="mini aprovar" data-aprovar="' + p.id + '">APROVAR</button>' : '') +
        '</div></td>' +
        '<td style="white-space:nowrap;font-size:14px">' + data(p.criado_em) + (p.aprovado_em ? '<br><span class="obs">aprovado ' + data(p.aprovado_em) + '</span>' : '') + '</td>' +
        '<td style="white-space:nowrap"><button class="mini" data-editar-p="' + p.id + '">EDITAR</button> <button class="mini perigo" data-apagar-p="' + p.id + '">×</button></td>' +
      '</tr>';
    }).join('');
  }
  $('busca').addEventListener('input', renderPessoas);
  $('filtroStatus').addEventListener('change', renderPessoas);

  $('tbPessoas').addEventListener('change', function (e) {
    var s = e.target.closest('select[data-status]'); if (!s) return;
    s.disabled = true;
    var mud = { status: s.value };
    if (s.value === 'reservado') mud.aprovado_em = null;
    else { var atual = pessoas.find(function (x) { return x.id === s.dataset.status; }); if (atual && !atual.aprovado_em) mud.aprovado_em = new Date().toISOString(); }
    sb.from('presenteadores').update(mud).eq('id', s.dataset.status).then(function (r) {
      if (r.error) alert(r.error.message); carregarTudo();
    });
  });
  var anexarPara = null;
  $('anexoLinha').addEventListener('change', function () {
    var f = this.files[0], id = anexarPara; this.value = '';
    if (!f || !id) return;
    enviarComprovante(id, f).then(carregarTudo).catch(function (err) { alert('Erro ao anexar: ' + (err.message || err)); });
  });
  $('tbPessoas').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.anexar) { anexarPara = b.dataset.anexar; $('anexoLinha').click(); return; }
    if (b.dataset.ver) {
      var pv = pessoas.find(function (x) { return x.id === b.dataset.ver; });
      var janela = window.open('', '_blank');
      sb.storage.from('comprovantes').createSignedUrl(pv.comprovante_path, 300).then(function (r) {
        if (r.error) { if (janela) janela.close(); alert(r.error.message); return; }
        if (janela) janela.location = r.data.signedUrl; else location.href = r.data.signedUrl;
      });
      return;
    }
    if (b.dataset.aprovar) {
      var pa = pessoas.find(function (x) { return x.id === b.dataset.aprovar; });
      if (!pa.comprovante_path && !confirm('Aprovar ' + pa.nome + ' sem comprovante anexado?')) return;
      b.disabled = true;
      sb.from('presenteadores').update({ status: 'comprado', aprovado_em: new Date().toISOString() }).eq('id', pa.id)
        .then(function (r) { if (r.error) alert(r.error.message); carregarTudo(); });
      return;
    }
    if (b.dataset.editarP) {
      var p = pessoas.find(function (x) { return x.id === b.dataset.editarP; });
      $('pId').value = p.id; $('pNome').value = p.nome; $('pTel').value = p.telefone || ''; $('pPresente').value = p.presente_id || '';
      $('pDesc').value = p.descricao || ''; $('pValor').value = p.valor == null ? '' : p.valor; $('pStatus').value = p.status; $('pObs').value = p.observacao || '';
      $('pComp').value = ''; $('pCompAtual').textContent = p.comprovante_path ? 'Já tem comprovante anexado — escolha outro arquivo só se quiser trocar.' : '';
      $('tituloPessoa').textContent = 'EDITAR REGISTRO'; $('msgPessoa').textContent = '';
      $('formPessoa').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (b.dataset.apagarP) {
      var q = pessoas.find(function (x) { return x.id === b.dataset.apagarP; });
      if (!confirm('Excluir o registro de ' + q.nome + '? Se for uma reserva do site, o presente volta a ficar disponível.')) return;
      sb.from('presenteadores').delete().eq('id', q.id).then(function (r) {
        if (r.error) { alert(r.error.message); return; }
        if (q.comprovante_path) sb.storage.from('comprovantes').remove([q.comprovante_path]);
        carregarTudo();
      });
    }
  });
  function enviarComprovante(id, file) {
    var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    var caminho = id + '/' + Date.now() + '.' + ext;
    var antigo = (pessoas.find(function (x) { return x.id === id; }) || {}).comprovante_path;
    return sb.storage.from('comprovantes').upload(caminho, file, { contentType: file.type || undefined, upsert: false }).then(function (r) {
      if (r.error) throw r.error;
      return sb.from('presenteadores').update({ comprovante_path: caminho }).eq('id', id);
    }).then(function (r) {
      if (r.error) throw r.error;
      if (antigo && antigo !== caminho) sb.storage.from('comprovantes').remove([antigo]);
    });
  }
  function limparPessoa() { $('formPessoa').reset(); $('pId').value = ''; $('pCompAtual').textContent = ''; $('tituloPessoa').textContent = 'LANÇAR PRESENTE'; $('msgPessoa').textContent = ''; }
  $('btnLimparPessoa').addEventListener('click', limparPessoa);
  $('formPessoa').addEventListener('submit', function (e) {
    e.preventDefault();
    var dados = {
      nome: $('pNome').value.trim(), telefone: $('pTel').value.trim() || null, presente_id: $('pPresente').value || null,
      descricao: $('pDesc').value.trim() || null, valor: num($('pValor').value), status: $('pStatus').value, observacao: $('pObs').value.trim() || null
    };
    if (!dados.nome) return;
    var id = $('pId').value, btn = $('btnSalvarPessoa');
    btn.disabled = true; $('msgPessoa').textContent = 'Salvando…';
    var antes = id ? pessoas.find(function (x) { return x.id === id; }) : null;
    if (dados.status === 'reservado') dados.aprovado_em = null;
    else if (!antes || !antes.aprovado_em) dados.aprovado_em = new Date().toISOString();
    var arquivo = $('pComp').files[0];
    var q = id ? sb.from('presenteadores').update(dados).eq('id', id).select('id').single()
               : sb.from('presenteadores').insert(Object.assign({ origem: 'manual' }, dados)).select('id').single();
    q.then(function (r) {
      if (r.error) throw r.error;
      return arquivo ? enviarComprovante(r.data.id, arquivo) : null;
    }).then(function () {
      limparPessoa(); $('msgPessoa').textContent = 'Salvo ✓';
      return carregarTudo();
    }).catch(function (err) {
      $('msgPessoa').textContent = 'Erro: ' + (err.message || err);
    }).then(function () { btn.disabled = false; });
  });

  $('btnCsv').addEventListener('click', function () {
    var linhas = [['Nome', 'WhatsApp', 'Item da lista', 'Descrição', 'Valor', 'Status', 'Comprovante', 'Aprovado em', 'Origem', 'Observação', 'Data']];
    filtradas().forEach(function (p) {
      linhas.push([p.nome, p.telefone, nomePresente(p.presente_id), p.descricao, p.valor, STATUS[p.status], p.comprovante_path ? 'sim' : 'não', data(p.aprovado_em), p.origem, p.observacao, data(p.criado_em)]);
    });
    var csv = '﻿' + linhas.map(function (l) { return l.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(';'); }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'presentes-isabelly.csv';
    a.click();
  });
})();
</script>
</body>
</html>
